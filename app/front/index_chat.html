<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>智能数据助手 · 灵境对话</title>
    <!-- ECharts CDN -->
    <script src="https://unpkg.com/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-message-user: #eef2ff;
            --bg-message-assistant: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: #e2e8f0;
            --avatar-bg: #eef2ff;
            --step-bg: #f1f5f9;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-light: #dbeafe;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            --shadow-glass: 0 8px 32px -8px rgba(0, 0, 0, 0.15);
            --table-header-bg: #f8fafc;
            --table-hover: #f1f5f9;
            --modal-bg: #ffffff;
            --modal-overlay: rgba(0, 0, 0, 0.5);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.4);
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-message-user: #1e2a44;
            --bg-message-assistant: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border-color: #334155;
            --avatar-bg: #334155;
            --step-bg: #1e293b;
            --accent: #60a5fa;
            --accent-hover: #3b82f6;
            --accent-light: #1e293b;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            --shadow-glass: 0 8px 32px -8px rgba(0, 0, 0, 0.5);
            --table-header-bg: #1e293b;
            --table-hover: #334155;
            --modal-bg: #1e293b;
            --modal-overlay: rgba(0, 0, 0, 0.7);
            --glass-bg: rgba(15, 23, 42, 0.8);
            --glass-border: rgba(51, 65, 85, 0.5);
        }

        html, body {
            height: 100%;
            width: 100%;
            background: var(--bg-secondary);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Roboto', sans-serif;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        #chatRoot {
            height: 100%;
            width: 100%;
        }

        .chat-app {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg-primary);
            overflow: hidden;
        }

        .chat-header {
            padding: 14px 28px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-primary);
            backdrop-filter: blur(12px);
            z-index: 10;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .theme-toggle, .config-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 8px 18px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.25s ease;
            color: var(--text-primary);
            backdrop-filter: blur(4px);
        }

        .theme-toggle:hover, .config-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 24px 20px 180px 20px;
            scroll-behavior: smooth;
            min-height: 0;
        }

        .messages-list {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--modal-overlay);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .modal-container {
            background: var(--modal-bg);
            border-radius: 32px;
            padding: 28px 32px;
            max-width: 420px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            animation: slideUp 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .modal-content {
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .modal-input {
            width: 100%;
            padding: 12px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            color: var(--text-primary);
            font-size: 0.95rem;
            margin-bottom: 24px;
            outline: none;
            transition: all 0.2s;
        }

        .modal-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 10px 22px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .modal-btn-cancel {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .modal-btn-cancel:hover {
            background: var(--border-color);
        }

        .modal-btn-confirm {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
        }

        .modal-btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .toast-notification {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--modal-bg);
            border: 1px solid var(--border-color);
            border-radius: 60px;
            padding: 12px 28px;
            box-shadow: var(--shadow-lg);
            z-index: 1001;
            animation: slideUp 0.3s ease;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 500;
            backdrop-filter: blur(12px);
        }

        .empty-state {
            text-align: center;
            padding: 60px 24px;
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-primary));
            border-radius: 48px;
            margin-top: 20px;
        }

        .empty-icon {
            font-size: 4.2rem;
            margin-bottom: 16px;
        }

        .recommend-questions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 28px;
        }

        .recommend-card {
            background: var(--bg-message-assistant);
            border: 1px solid var(--border-color);
            border-radius: 32px;
            padding: 12px 22px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 500;
            backdrop-filter: blur(4px);
        }

        .recommend-card:hover {
            background: var(--accent);
            color: white;
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            animation: fadeSlideUp 0.3s ease-out;
        }

        .message-row.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: var(--avatar-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }

        .bubble {
            max-width: 85%;
            padding: 14px 20px;
            border-radius: 28px;
            line-height: 1.55;
            font-size: 0.95rem;
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
            overflow: visible;
            height: auto;
        }

        .message-row.user .bubble {
            background: var(--bg-message-user);
            border-bottom-right-radius: 8px;
            background: linear-gradient(135deg, var(--accent-light), var(--bg-message-user));
            border: 1px solid var(--border-color);
        }

        .message-row.assistant .bubble {
            background: var(--bg-message-assistant);
            border-bottom-left-radius: 8px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(2px);
        }

        /* 表格容器 - 无滚动条 */
        .modern-table-wrapper {
            overflow-x: auto;
            overflow-y: visible;
            border-radius: 16px;
            margin: 12px 0;
            box-shadow: var(--shadow-sm);
            max-height: none;
        }

        .modern-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            background: var(--bg-primary);
        }

        .modern-table th {
            background: var(--table-header-bg);
            padding: 14px 18px;
            text-align: left;
            font-weight: 700;
            color: var(--text-primary);
            border-bottom: 2px solid var(--accent);
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .modern-table td {
            padding: 12px 18px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            transition: background 0.15s;
            white-space: nowrap;
        }

        .modern-table tbody tr:hover {
            background: var(--table-hover);
        }

        .chart-container {
            width: 100%;
            min-height: 320px;
            height: auto;
            margin: 16px 0;
            background: var(--bg-primary);
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            padding: 8px;
        }

        .chart-container canvas {
            width: 100% !important;
            height: 320px !important;
        }

        .data-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .data-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 6px 16px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .data-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.9rem;
            padding: 8px 0;
        }

        .circular-progress {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            background: conic-gradient(var(--accent) 0deg, var(--step-bg) 0deg);
            position: relative;
        }

        .circular-progress::after {
            content: attr(data-percent);
            position: absolute;
            inset: 3px;
            background: var(--bg-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 800;
            color: var(--accent);
        }

        .step-text {
            font-weight: 500;
        }

        .steps-container {
            overflow: visible;
            height: auto;
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .input-float {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            pointer-events: none;
            padding: 0 20px;
            z-index: 20;
        }

        .input-card {
            pointer-events: auto;
            width: 100%;
            max-width: 820px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-glass), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            padding: 6px 6px 6px 24px;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .input-card:focus-within {
            box-shadow: 0 8px 28px -8px var(--accent);
            border-color: var(--accent);
        }

        .input-card input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 1rem;
            padding: 14px 0;
            color: var(--text-primary);
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .icon-btn:hover {
            background: var(--bg-secondary);
            transform: scale(1.08);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            border: none;
            border-radius: 48px;
            padding: 10px 28px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .mic-btn.recording {
            color: #ef4444;
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-red {
            0%, 100% {
                opacity: 1;
                text-shadow: 0 0 2px red;
            }
            50% {
                opacity: 0.5;
            }
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .messages-container::-webkit-scrollbar {
            width: 5px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 8px;
        }

        .skeleton-thinking {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
<div id="chatRoot"></div>
<script>
    (function () {
        const API_URL = "/api/query";
        let messages = [];
        let loading = false;
        let isRecording = false;
        let recognition = null;
        let requestId = localStorage.getItem('request_id') || null;

        let messagesContainer, messagesListEl, inputEl, sendBtn, clearBtn, micBtn, themeToggle, configBtn;
        let currentTheme = 'light';

        function showModal(options) {
            const { title, message, inputPlaceholder, onConfirm, onCancel, confirmText = '确定', cancelText = '取消', isDanger = false } = options;
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            const modalHtml = `
                <div class="modal-container">
                    <div class="modal-title">${title}</div>
                    <div class="modal-content">${message}</div>
                    ${inputPlaceholder ? `<input type="text" class="modal-input" id="modalInput" placeholder="${inputPlaceholder}" />` : ''}
                    <div class="modal-buttons">
                        <button class="modal-btn modal-btn-cancel" id="modalCancel">${cancelText}</button>
                        <button class="modal-btn ${isDanger ? 'modal-btn-danger' : 'modal-btn-confirm'}" id="modalConfirm">${confirmText}</button>
                    </div>
                </div>
            `;
            overlay.innerHTML = modalHtml;
            document.body.appendChild(overlay);
            const inputEl_modal = inputPlaceholder ? overlay.querySelector('#modalInput') : null;
            const confirmBtn = overlay.querySelector('#modalConfirm');
            const cancelBtn = overlay.querySelector('#modalCancel');
            const closeModal = () => overlay.remove();
            confirmBtn.addEventListener('click', () => {
                const inputValue = inputEl_modal ? inputEl_modal.value : null;
                if (onConfirm) onConfirm(inputValue);
                closeModal();
            });
            cancelBtn.addEventListener('click', () => { if (onCancel) onCancel(); closeModal(); });
            overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
        }

        function showToast(message, duration = 2200) {
            const toast = document.createElement('div');
            toast.className = 'toast-notification';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), duration);
        }

        function setTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            if (themeToggle) themeToggle.textContent = theme === 'light' ? '🌙 深色' : '☀️ 浅色';
        }

        function toggleTheme() { setTheme(currentTheme === 'light' ? 'dark' : 'light'); }

        function showConfigModal() {
            showModal({
                title: '⚙️ 请求标识',
                message: '设置 Request ID (X-Request-ID) 用于链路追踪',
                inputPlaceholder: '输入 Request ID',
                confirmText: '保存',
                onConfirm: (value) => {
                    if (value && value.trim()) {
                        requestId = value.trim();
                        localStorage.setItem('request_id', requestId);
                        showToast(`✅ Request ID 已设置: ${requestId}`);
                    } else {
                        requestId = null;
                        localStorage.removeItem('request_id');
                        showToast('已清除 Request ID');
                    }
                }
            });
        }

        function initSpeechRecognition() {
            const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognitionAPI) return null;
            const rec = new SpeechRecognitionAPI();
            rec.lang = 'zh-CN';
            rec.interimResults = false;
            rec.maxAlternatives = 1;
            return rec;
        }

        function startVoiceInput() {
            if (!recognition) {
                showModal({ title: '🎤 暂不支持', message: '当前浏览器不支持语音识别，请使用 Chrome/Edge/Safari', confirmText: '知道了' });
                return;
            }
            if (isRecording) return;
            try {
                isRecording = true;
                micBtn.classList.add('recording');
                micBtn.textContent = '🎤⚡';
                recognition.start();
                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    inputEl.value = transcript;
                    isRecording = false;
                    micBtn.classList.remove('recording');
                    micBtn.textContent = '🎤';
                };
                recognition.onerror = () => {
                    showModal({ title: '🎤 识别失败', message: '语音识别出错，请检查麦克风权限', confirmText: '知道了' });
                    isRecording = false;
                    micBtn.classList.remove('recording');
                    micBtn.textContent = '🎤';
                };
                recognition.onend = () => {
                    isRecording = false;
                    micBtn.classList.remove('recording');
                    micBtn.textContent = '🎤';
                };
            } catch (err) {
                showModal({ title: '🎤 启动失败', message: '无法启动语音识别', confirmText: '知道了' });
                isRecording = false;
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function formatNumber(num) {
            if (typeof num !== 'number') return num;
            if (num >= 10000) return (num / 10000).toFixed(2) + '万';
            if (num >= 1000) return (num / 1000).toFixed(1) + '千';
            return num.toLocaleString('zh-CN');
        }

        function exportToCSV(columns, rows, filename = 'data.csv') {
            const csvRows = [columns.join(',')];
            for (const row of rows) {
                const values = columns.map(col => {
                    let val = row[col] !== undefined ? row[col] : '';
                    return `"${String(val).replace(/"/g, '""')}"`;
                });
                csvRows.push(values.join(','));
            }
            const blob = new Blob([csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📥 导出CSV成功');
        }

        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                showToast('📋 表格已复制');
            } catch { showToast('❌ 复制失败'); }
        }

        function renderChart(elementId, columns, rows) {
            if (typeof echarts === 'undefined') { setTimeout(() => renderChart(elementId, columns, rows), 200); return; }
            const chartDom = document.getElementById(elementId);
            if (!chartDom) return;
            const myChart = echarts.init(chartDom);
            const numericCols = columns.filter(col => rows.some(row => typeof row[col] === 'number'));
            if (numericCols.length === 0) return;
            const categoryCol = columns.find(col => rows.some(row => typeof row[col] !== 'number')) || columns[0];
            const categories = rows.map(row => row[categoryCol]);
            const series = numericCols.map((col, idx) => ({
                name: col,
                type: 'bar',
                data: rows.map(row => row[col]),
                itemStyle: {
                    borderRadius: [8, 8, 0, 0],
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: idx === 0 ? '#3b82f6' : '#a855f7' },
                        { offset: 1, color: idx === 0 ? '#60a5fa' : '#c084fc' }
                    ])
                },
                label: { show: true, position: 'top', formatter: (p) => formatNumber(p.value), color: 'var(--accent)' }
            }));
            myChart.setOption({
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                grid: { containLabel: true, left: 60, right: 30, top: 50, bottom: 30 },
                xAxis: { type: 'category', data: categories, axisLabel: { rotate: categories.length > 6 ? 25 : 0, color: 'var(--text-primary)' } },
                yAxis: { type: 'value', name: numericCols[0], nameTextStyle: { color: 'var(--text-secondary)' }, axisLabel: { color: 'var(--text-primary)' } },
                series: series,
                legend: { data: numericCols, textStyle: { color: 'var(--text-primary)' }, right: 10, top: 0 },
                backgroundColor: 'transparent'
            });
            window.addEventListener('resize', () => myChart.resize());
        }

        function renderModernTable(columns, rows, msgIndex) {
            const chartId = `chart-${msgIndex}-${Date.now()}`;
            let tableHtml = `
                <div class="data-actions">
                    <button class="data-btn" onclick="window.copyTableData(${msgIndex})">📋 复制表格</button>
                    <button class="data-btn" onclick="window.exportTableData(${msgIndex})">📥 导出CSV</button>
                    <button class="data-btn" onclick="window.showChart(${msgIndex}, '${chartId}')">📊 可视化图表</button>
                </div>
                <div class="modern-table-wrapper"><table class="modern-table"><thead><tr>
            `;
            for (let col of columns) tableHtml += `<th>${escapeHtml(col)}</th>`;
            tableHtml += `</tr></thead><tbody>`;
            for (let row of rows) {
                tableHtml += `<tr>`;
                for (let col of columns) {
                    let cellValue = row[col];
                    const isNumber = typeof cellValue === 'number';
                    const align = isNumber ? 'right' : 'left';
                    const displayValue = isNumber ? formatNumber(cellValue) : escapeHtml(String(cellValue ?? ''));
                    tableHtml += `<td style="text-align: ${align}; font-weight: ${isNumber ? '600' : 'normal'}; white-space: nowrap;">${displayValue}</td>`;
                }
                tableHtml += `</tr>`;
            }
            tableHtml += `</tbody></table></div><div id="${chartId}" class="chart-container" style="display: none;"></div>`;
            return tableHtml;
        }

        function scrollToBottom() {
            setTimeout(() => { if (messagesContainer) messagesContainer.scrollTop = messagesContainer.scrollHeight; }, 20);
        }

        function renderMessages() {
            if (!messagesListEl) return;
            if (!messages.length) {
                messagesListEl.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">✨🤖✨</div>
                        <h3 style="margin-bottom: 12px;">智能数据引擎</h3>
                        <p style="color: var(--text-secondary);">自然语言 → SQL → 洞察</p>
                        <div class="recommend-questions">
                            <div class="recommend-card" data-question="统计华北地区的销售总额">📊 华北地区销售总额</div>
                            <div class="recommend-card" data-question="各个地区的销售额排名">🏆 各地区销售额排名</div>
                            <div class="recommend-card" data-question="近30天销售趋势">📈 近30天销售趋势</div>
                            <div class="recommend-card" data-question="用户活跃度分析">👥 用户活跃度分析</div>
                        </div>
                    </div>
                `;
                document.querySelectorAll('.recommend-card').forEach(card => {
                    card.addEventListener('click', () => { if (!loading) { inputEl.value = card.getAttribute('data-question'); sendQuestion(); } });
                });
                scrollToBottom();
                return;
            }
            let html = '';
            for (let i = 0; i < messages.length; i++) {
                const msg = messages[i];
                const roleClass = msg.role === 'user' ? 'user' : 'assistant';
                const avatarIcon = msg.role === 'user' ? '🧑' : '🤖';
                let bubbleContent = '';
                if (msg.type === 'text') bubbleContent = `<div class="plain-text">${escapeHtml(msg.content)}</div>`;
                else if (msg.type === 'steps') {
                    let stepsHtml = '<div class="steps-container">';
                    if (msg.steps && msg.steps.length) {
                        for (let s of msg.steps) {
                            let percent = s.status === 'running' ? 50 : (s.status === 'success' ? 100 : 0);
                            stepsHtml += `<div class="step-item"><div class="circular-progress" data-percent="${percent}%" style="background: conic-gradient(var(--accent) ${percent * 3.6}deg, var(--step-bg) ${percent * 3.6}deg);"></div><span class="step-text">${escapeHtml(s.text)}</span></div>`;
                        }
                    } else stepsHtml += '<div class="skeleton-thinking"><div class="loading-spinner"></div> 思考中...</div>';
                    stepsHtml += '</div>';
                    bubbleContent = stepsHtml;
                } else if (msg.type === 'table') {
                    if (msg.columns && msg.rows && msg.rows.length) bubbleContent = renderModernTable(msg.columns, msg.rows, i);
                    else bubbleContent = '<div style="color: var(--text-secondary);">暂无数据</div>';
                } else if (msg.type === 'loading') bubbleContent = '<div class="skeleton-thinking"><div class="loading-spinner"></div> 思考中...</div>';
                else if (msg.type === 'error') bubbleContent = `<div class="plain-text" style="color:#ef4444;">⚠️ ${escapeHtml(msg.content)}</div>`;
                html += `<div class="message-row ${roleClass}" data-msg-idx="${i}"><div class="avatar">${avatarIcon}</div><div class="bubble">${bubbleContent}</div></div>`;
            }
            messagesListEl.innerHTML = html;
            scrollToBottom();
        }

        window.copyTableData = (idx) => { const msg = messages[idx]; if (msg?.type === 'table') copyToClipboard(msg.rows.map(r => msg.columns.map(c => r[c]).join('\t')).join('\n')); };
        window.exportTableData = (idx) => { const msg = messages[idx]; if (msg?.type === 'table') exportToCSV(msg.columns, msg.rows, `data_${Date.now()}.csv`); };
        window.showChart = (idx, chartId) => {
            const msg = messages[idx];
            if (!msg || msg.type !== 'table') return;
            const container = document.getElementById(chartId);
            if (!container) return;
            if (container.style.display === 'none') {
                container.style.display = 'block';
                renderChart(chartId, msg.columns, msg.rows);
                showToast('📊 图表已渲染');
            } else container.style.display = 'none';
        };

        function clearMessages() {
            showModal({ title: '🗑️ 清空对话', message: '确定清空所有记录？不可恢复', confirmText: '清空', isDanger: true, onConfirm: () => { messages = []; renderMessages(); showToast('✅ 对话已清空'); } });
        }

        async function sendQuestion() {
            if (loading) return;
            const q = inputEl.value.trim();
            if (!q) return;
            inputEl.value = '';
            loading = true;
            updateSendButtonState();

            messages.push({ role: 'user', type: 'text', content: q });
            messages.push({ role: 'assistant', type: 'loading' });
            renderMessages();
            const loadingIndex = messages.length - 1;
            const requestBody = { query: q };

            try {
                const headers = { "Content-Type": "application/json" };
                if (requestId) headers["X-Request-ID"] = requestId;

                const response = await fetch(API_URL, { method: "POST", headers, body: JSON.stringify(requestBody) });

                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                if (!response.body) throw new Error("响应体为空");

                messages.splice(loadingIndex, 1);
                const stepsMsgIndex = messages.push({ role: 'assistant', type: 'steps', steps: [] }) - 1;
                renderMessages();

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";
                let hasReceivedResult = false;

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    let lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        const trimmedLine = line.trim();
                        if (!trimmedLine) continue;

                        let jsonStr = trimmedLine;
                        if (trimmedLine.startsWith('data:')) jsonStr = trimmedLine.substring(5).trim();
                        if (!jsonStr || jsonStr === '[DONE]') continue;

                        try {
                            const data = JSON.parse(jsonStr);

                            if (data.type === 'progress') {
                                const stepsMsg = messages[stepsMsgIndex];
                                if (stepsMsg && stepsMsg.type === 'steps') {
                                    let step = stepsMsg.steps.find(s => s.text === data.step);
                                    if (!step) {
                                        step = { text: data.step, status: data.status || 'running' };
                                        stepsMsg.steps.push(step);
                                    } else step.status = data.status;
                                    renderMessages();
                                }
                            } else if (data.type === 'result' || data.type === 'data' || data.data) {
                                let resultData = data.data || data.result;
                                if (Array.isArray(resultData) && resultData.length > 0) {
                                    const columns = Object.keys(resultData[0]);
                                    messages.push({ role: "assistant", type: "table", columns: columns, rows: resultData });
                                    renderMessages();
                                    hasReceivedResult = true;
                                } else if (resultData && typeof resultData === 'object' && !Array.isArray(resultData)) {
                                    const rows = [resultData];
                                    const columns = Object.keys(resultData);
                                    messages.push({ role: "assistant", type: "table", columns: columns, rows: rows });
                                    renderMessages();
                                    hasReceivedResult = true;
                                } else if (typeof resultData === 'string') {
                                    messages.push({ role: "assistant", type: "text", content: resultData });
                                    renderMessages();
                                    hasReceivedResult = true;
                                }
                            } else if (data.type === 'error' || data.error) {
                                messages.push({ role: "assistant", type: "error", content: data.message || data.error || "执行查询时发生错误" });
                                renderMessages();
                            }
                        } catch (e) {
                            console.warn('JSON解析失败:', jsonStr);
                        }
                    }
                }

                if (!hasReceivedResult && messages[stepsMsgIndex]) {
                    messages.splice(stepsMsgIndex, 1);
                    messages.push({ role: "assistant", type: "text", content: "查询已完成，但未返回数据。" });
                    renderMessages();
                }

            } catch (err) {
                console.error('请求失败:', err);
                messages.splice(loadingIndex, 1);
                messages.push({ role: "assistant", type: "error", content: err?.message || "网络请求失败，请检查后端服务" });
                renderMessages();
            } finally {
                loading = false;
                updateSendButtonState();
                scrollToBottom();
            }
        }

        function updateSendButtonState() { if (sendBtn) sendBtn.disabled = loading; if (inputEl) inputEl.disabled = loading; }
        function onInputKeydown(e) { if (e.key === 'Enter' && !e.shiftKey && !loading) { e.preventDefault(); sendQuestion(); } }

        function initUI() {
            const root = document.getElementById('chatRoot');
            if (!root) return;
            root.innerHTML = `
                <div class="chat-app">
                    <div class="chat-header">
                        <span class="header-title">🤖 灵境 · 数据智能助手-xsy</span>
                        <div class="header-controls"><button class="config-btn" id="configBtn">⚙️ 标识</button><button class="theme-toggle" id="themeToggle">🌙 深色</button></div>
                    </div>
                    <div class="messages-container" id="messagesContainer"><div class="messages-list" id="messagesList"></div></div>
                    <div class="input-float"><div class="input-card"><input type="text" id="chatInput" placeholder="问数据、查趋势... 或点击🎤语音" autocomplete="off" /><button class="icon-btn mic-btn" id="micBtn">🎤</button><button class="icon-btn clear-btn" id="clearBtn">🗑️</button><button class="send-btn" id="sendButton">发送</button></div></div>
                </div>
            `;
            messagesContainer = document.getElementById('messagesContainer');
            messagesListEl = document.getElementById('messagesList');
            inputEl = document.getElementById('chatInput');
            sendBtn = document.getElementById('sendButton');
            micBtn = document.getElementById('micBtn');
            clearBtn = document.getElementById('clearBtn');
            themeToggle = document.getElementById('themeToggle');
            configBtn = document.getElementById('configBtn');
            inputEl?.addEventListener('keydown', onInputKeydown);
            sendBtn?.addEventListener('click', sendQuestion);
            if (micBtn) { recognition = initSpeechRecognition(); micBtn.addEventListener('click', startVoiceInput); }
            clearBtn?.addEventListener('click', clearMessages);
            themeToggle?.addEventListener('click', toggleTheme);
            configBtn?.addEventListener('click', showConfigModal);
            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme);
            renderMessages();
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initUI);
        else initUI();
    })();
</script>
</body>
</html>
