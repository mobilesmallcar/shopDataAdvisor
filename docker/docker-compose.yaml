name: shopDataAdvisor

services:

  mysql:
    image: mysql:8.0
    container_name: shopDataAdvisor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_USER: shaw
      MYSQL_PASSWORD: "123456"
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --innodb_buffer_pool_size=64M
      - --key_buffer_size=16M
      - --max_connections=50
      - --table_open_cache=128
      - --mysqlx=off
      - --tmp_table_size=16M
      - --max_heap_table_size=16M
      - --performance_schema=off
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    build: ./elasticsearch
    container_name: shopDataAdvisor-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
      _JAVA_OPTIONS: "-XX:MaxDirectMemorySize=64m"
    ports:
      - "19200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.16
    container_name: shopDataAdvisor-qdrant
    restart: unless-stopped
    ports:
      - "16333:6333"   # HTTP
      - "16334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: shopDataAdvisor-app
    restart: unless-stopped
    ports:
      - "18083:18083"
    volumes:
      - ./app_config.yaml:/app/conf/app_config.yaml:ro
      - app_logs:/app/logs
      # 开发环境：挂载源码实现热更新（生产环境建议注释掉下面几行）
      - ../app:/app/app
      - ../main.py:/app/main.py
      - ../prompts:/app/prompts
      - ../scripts:/app/scripts
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  mysql_data:
  es_data:
  qdrant_data:
  app_logs:
