[project]
name = "shopdataadvisor"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.11.0+cu130",
    "torchvision==0.26.0+cu130",
    "sentence-transformers==5.3.0",
    "asyncmy>=0.2.11",
    "cryptography>=46.0.5",
    "elasticsearch[async]==8.19.*",
    "jieba>=0.42.1",
    "langchain-huggingface>=1.2.1",
    "loguru>=0.7.3",
    "omegaconf>=2.3.0",
    "qdrant-client==1.16.*",
    "sqlalchemy>=2.0.48",
    "langgraph>=1.1.3",
    "langchain>=1.2.13",
    "langchain-openai>=1.1.12",
    "fastapi[standard]>=0.135.2",
    "uvicorn>=0.42.0",
]
# 显式定义 PyTorch 专用 index
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# 强制 torch 和 torchvision 只走上面定义的 index
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
# Ubuntu / Linux 通用环境（CPU 版本）
required-environments = [
    'sys_platform == "linux" and platform_machine == "x86_64"'
]
